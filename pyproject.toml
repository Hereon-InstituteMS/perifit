[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perifit"
version = "3.0.0"
description = "Surface corrections for peridynamics: nodal weights and bond weights for 1-D, 2-D and 3-D models"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "peridynamics", "surface correction", "surface effect", "bond-based peridynamics",
    "state-based peridynamics", "LPS", "nodal weights", "bond weights",
    "meshfree", "nonlocal mechanics",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.12",
]

[project.optional-dependencies]
vtk    = ["pyvista>=0.42"]
exodus = ["netCDF4>=1.6"]
hdf5   = ["h5py>=3.8"]
gmsh   = ["meshio>=5.3"]
all    = ["pyvista>=0.42", "netCDF4>=1.6", "h5py>=3.8", "meshio>=5.3"]
dev    = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage   = "https://github.com/Hereon-InstituteMS/perifit"
Repository = "https://github.com/Hereon-InstituteMS/perifit"
Issues     = "https://github.com/Hereon-InstituteMS/perifit/issues"

[project.scripts]
perifit = "perifit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["perifit*"]

[tool.setuptools.package-data]
perifit = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
